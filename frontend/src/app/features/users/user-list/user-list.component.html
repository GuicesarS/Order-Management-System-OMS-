<div class="page-header">
  <h1>Usuários</h1>
  <button mat-flat-button color="primary" routerLink="/users/new">
    <mat-icon>add</mat-icon>
    Novo Usuário
  </button>
</div>

<div class="table-container mat-elevation-z1">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
      <td mat-cell *matCellDef="let u">{{ u.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
      <td mat-cell *matCellDef="let u">{{ u.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
      <td mat-cell *matCellDef="let u">
        <mat-chip-set>
          <mat-chip [color]="u.role === 'Admin' ? 'primary' : undefined">{{ u.role }}</mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Criado em</th>
      <td mat-cell *matCellDef="let u">{{ u.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let u">
        <button mat-icon-button [routerLink]="['/users', u.id, 'edit']" title="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="remove(u)" [disabled]="u.id === currentUserId" title="Excluir">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">
        @if (loading()) {
          Carregando...
        } @else {
          Nenhum usuário encontrado.
        }
      </td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
</div>
